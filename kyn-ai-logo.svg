<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Outer Green Glow Filter -->
    <filter id="outerGreenGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur1"/>
      <feGaussianBlur stdDeviation="10" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      /* Smooth ON / OFF toggle for the green outer glow */
      @keyframes glowToggle {
        0%, 100% {
          opacity: 0;   /* OFF: Pure solid white logo */
        }
        30%, 70% {
          opacity: 1;   /* ON: Crisp white logo with intense outer green radiance */
        }
      }

      .green-glow-layer {
        animation: glowToggle 3.5s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Pure Black Background -->
  <rect width="200" height="200" fill="#000000"/>

  <!-- 
    Layer 1: Green Outer Radiance Layer (Animates ON and OFF)
  -->
  <path class="green-glow-layer"
    d="M 149.79 58.22 A 65 65 0 1 1 111.29 35.99 L 100 100 Z" 
    stroke="#00FF9D" 
    stroke-width="12" 
    fill="none" 
    stroke-linejoin="miter" 
    stroke-miterlimit="10"
    filter="url(#outerGreenGlow)"
  />

  <!-- 
    Layer 2: Core Solid White Symbol (Always Crisp & Visible)
    Center: (100, 100) | Radius: 65 | Stroke Width: 10
  -->
  <path 
    d="M 149.79 58.22 A 65 65 0 1 1 111.29 35.99 L 100 100 Z" 
    stroke="#FFFFFF" 
    stroke-width="10" 
    fill="none" 
    stroke-linejoin="miter" 
    stroke-miterlimit="10"
  />
</svg>
